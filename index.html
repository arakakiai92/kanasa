<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>LINEスタンプ切り出しメーカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>LINEスタンプ切り出しメーカー</h1>
  <div class="type-switch">
    <button data-type="sticker" class="active">スタンプ</button>
    <button data-type="emoji">絵文字</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="row">
      <label class="field">作成数
        <select id="count">
          <option>8</option><option selected>16</option><option>24</option>
          <option>32</option><option>40</option>
        </select>
      </label>
      <label class="upload">
        <input id="file" type="file" accept="image/*">
        <span>📷 シートを読み込む</span>
      </label>
    </div>
    <p class="hint">シートの好きな場所をドラッグして囲み、必要なら四隅を動かして調整してください。</p>
  </section>

  <section id="editor" class="editor hidden">
    <div class="status">
      <b id="progress">カット 1 / 16</b>
      <button id="reset" class="small">↺ 枠をリセット</button>
    </div>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="cropBox" class="crop-box">
        <i data-handle="nw"></i><i data-handle="ne"></i>
        <i data-handle="sw"></i><i data-handle="se"></i>
      </div>
    </div>
    <div class="tools">
      <button id="transparent">✨ 背景を透過</button>
      <button id="saveOne">💾 このカットを保存</button>
      <button id="next" class="primary">次のカット →</button>
    </div>
  </section>

  <section class="results">
    <div class="results-head">
      <h2>作成済み <span id="done">0</span></h2>
      <button id="zip" disabled>📦 全部をZIP保存</button>
    </div>
    <div id="thumbs" class="thumbs"></div>
  </section>
</main>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="script.js"></script>
</body>
</html>
